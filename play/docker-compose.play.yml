# play.maia.city on the production machine, layered on legacy's compose files, which it does not change:
#   set -a; . ./play.env; set +a
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f play/docker-compose.play.yml up -d play-api
# play.env (on the server, never in git) holds PLAY_IMAGE, PLAY_DATABASE_URL and the bucket's PLAY_BUCKET_* values.
# Caddy answers play.maia.city and proxies it here (deploy/Caddyfile).
services:
  play-api:
    image: ${PLAY_IMAGE:?set PLAY_IMAGE in play.env}
    container_name: maia-city-play
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      TZ: Europe/Berlin
      DATABASE_URL: ${PLAY_DATABASE_URL:?set PLAY_DATABASE_URL in play.env}
      RP_ID: maia.city
      RP_NAME: maiaCITY play
      SITE_ORIGIN: https://play.maia.city
      PLAY_BUCKET: ${PLAY_BUCKET:-}
      PLAY_BUCKET_ENDPOINT: ${PLAY_BUCKET_ENDPOINT:-}
      PLAY_BUCKET_REGION: ${PLAY_BUCKET_REGION:-}
      PLAY_BUCKET_ACCESS_KEY: ${PLAY_BUCKET_ACCESS_KEY:-}
      PLAY_BUCKET_SECRET_KEY: ${PLAY_BUCKET_SECRET_KEY:-}
      # without a bucket the blobs stay on the volume
      PLAY_BLOBS: /data/blobs
    volumes:
      - ${PLAY_DATA_PATH:?set PLAY_DATA_PATH in play.env}:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
