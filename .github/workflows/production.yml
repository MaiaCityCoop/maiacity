# production: what is released. A pull request to production takes main of this repository only ('Only from main')
# and runs play's checks; a push to production (main merged in) runs them again on the commit that landed and then
# deploys play to play.maia.city (play/SPEC.md §9): the image to GHCR, the DNS record, the server — play's role and
# schema in the same Postgres, play-api beside the running containers (--no-deps), the import, Caddy answering
# play.maia.city. As legacy's release ran: GitHub Actions with the DEPLOY_SSH_KEY secret. The release pipelines are this
# repository's again (Samuel 2026-11-02; theOS's are parked in .github/workflows-theos/).
name: production

on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_DIR: /opt/maia-city
  HOST: api.maia.city

jobs:
  from-main:
    name: Only from main
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: The pull request comes from main of this repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" = main ] && [ "${HEAD_REPO,,}" = "${REPO,,}" ]; then echo "The pull request comes from main of $REPO."; exit 0; fi
          echo "::error::production takes changes from main of $REPO only; this pull request comes from ${HEAD_REPO:-?}:${HEAD_REF:-?}"
          exit 1

  checks:
    name: play
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/play-checks.yml

  image:
    name: The image
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-play:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -f play/Dockerfile -t "${{ steps.tag.outputs.image }}" .
          docker push "${{ steps.tag.outputs.image }}"

  server:
    name: The server
    needs: image
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: The server's volume, from the Pulumi state
        id: infra
        run: |
          git fetch --depth=1 origin pulumi-state
          out=$(git show FETCH_HEAD:.pulumi/stacks/maiacity/prod.json | jq -c '.checkpoint.latest.resources[] | select(.type == "pulumi:pulumi:Stack") | .outputs')
          mount=$(jq -r '.dataMount | strings' <<< "$out")
          ipv4=$(jq -r '.ipv4 | strings' <<< "$out")
          [[ -n "$mount" && "$ipv4" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no dataMount or ipv4 in the Pulumi state"; exit 1; }
          echo "data_mount=$mount" >> "$GITHUB_OUTPUT"
          echo "ipv4=$ipv4" >> "$GITHUB_OUTPUT"
      # play.maia.city's A record to the server, as legacy's deploy kept its names (.github/workflows-avendb/avendeploy.yml):
      # Hetzner's DNS Console API (HETZNER_DNS_TOKEN) or the Cloud API's zones (HETZNER_DNS_TOKEN or HETZNER_API_KEY);
      # read first, written only when it differs
      - name: DNS
        env:
          DNS_TOKEN: ${{ secrets.HETZNER_DNS_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HETZNER_API_KEY }}
          IPV4: ${{ steps.infra.outputs.ipv4 }}
          ZONE: maia.city
          NAME: play
          CLOUD: https://api.hetzner.cloud/v1
        run: |
          api=
          if [ -n "$DNS_TOKEN" ]; then
            zone=$(curl -fsS -H "Auth-API-Token: $DNS_TOKEN" "https://dns.hetzner.com/api/v1/zones?name=$ZONE" 2> /dev/null | jq -r '.zones[0].id // empty' || true)
            [ -n "$zone" ] && api=dns
          fi
          if [ -z "$api" ]; then
            for token in "$DNS_TOKEN" "$HCLOUD_TOKEN"; do
              [ -n "$token" ] || continue
              if curl -fsS -o /dev/null -H "Authorization: Bearer $token" "$CLOUD/zones/$ZONE" 2> /dev/null; then api=cloud; CLOUD_DNS=$token; break; fi
            done
          fi
          if [ -z "$api" ]; then
            echo "::warning::No token reaches the zone $ZONE: set by hand  $NAME.$ZONE. 300 IN A $IPV4"
            exit 0
          fi
          if [ "$api" = dns ]; then
            H="Auth-API-Token: $DNS_TOKEN"
            records=$(curl -fsS -H "$H" "https://dns.hetzner.com/api/v1/records?zone_id=$zone" | jq -c --arg n "$NAME" '[.records[] | select(.type == "A" and .name == $n)]')
            now=$(jq -r 'map(.value) | join(" ")' <<< "$records")
            echo "A $NAME.$ZONE now: ${now:-none}"
            [ "$now" = "$IPV4" ] && exit 0
            body=$(jq -nc --arg z "$zone" --arg n "$NAME" --arg v "$IPV4" '{zone_id: $z, type: "A", name: $n, value: $v, ttl: 300}')
            id=$(jq -r '.[0].id // empty' <<< "$records")
            if [ -n "$id" ]; then curl -fsS -X PUT -H "$H" -H 'Content-Type: application/json' -d "$body" "https://dns.hetzner.com/api/v1/records/$id" > /dev/null
            else curl -fsS -X POST -H "$H" -H 'Content-Type: application/json' -d "$body" https://dns.hetzner.com/api/v1/records > /dev/null; fi
          else
            H="Authorization: Bearer $CLOUD_DNS"
            set=$(curl -sS -H "$H" "$CLOUD/zones/$ZONE/rrsets/$NAME/A")
            now=$(jq -r '.rrset.records // [] | map(.value) | join(" ")' <<< "$set")
            echo "A $NAME.$ZONE now: ${now:-none}"
            [ "$now" = "$IPV4" ] && exit 0
            records=$(jq -nc --arg v "$IPV4" '[{value: $v}]')
            if jq -e .rrset > /dev/null <<< "$set"; then
              curl -fsS -X POST -H "$H" -H 'Content-Type: application/json' -d "{\"records\": $records}" "$CLOUD/zones/$ZONE/rrsets/$NAME/A/actions/set_records" > /dev/null
            else
              curl -fsS -X POST -H "$H" -H 'Content-Type: application/json' -d "$(jq -nc --arg n "$NAME" --argjson r "$records" '{name: $n, type: "A", ttl: 300, records: $r}')" "$CLOUD/zones/$ZONE/rrsets" > /dev/null
            fi
          fi
          echo "A $NAME.$ZONE set: $IPV4"
      - uses: ./.github/actions/prod-ssh
        with:
          host: ${{ env.HOST }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Copy play's files
        run: |
          ssh prod "mkdir -p $APP_DIR/play/deploy"
          scp play/docker-compose.play.yml "prod:$APP_DIR/play/docker-compose.play.yml"
          scp play/deploy/setup.sql play/deploy/after-import.sql play/deploy/Caddyfile.play "prod:$APP_DIR/play/deploy/"
      - name: Start play-api, import, and answer play.maia.city
        env:
          DATA_MOUNT: ${{ steps.infra.outputs.data_mount }}
          IMAGE: ${{ needs.image.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          ssh prod "cd $APP_DIR && bash -s" <<EOS
          set -e
          exec 9>.env.lock; flock -w 300 9
          # play's database password: made once beside Postgres's data, never in git or a log
          PWFILE="$DATA_MOUNT/.play_db_password"
          if [ ! -f "\$PWFILE" ]; then openssl rand -hex 24 | sudo tee "\$PWFILE" >/dev/null; sudo chown deploy "\$PWFILE"; sudo chmod 600 "\$PWFILE"; fi
          PW=\$(cat "\$PWFILE")
          sudo mkdir -p "$DATA_MOUNT/play" && sudo chown 1000:1000 "$DATA_MOUNT/play"
          umask 077
          cat > play.env <<EOF2
          PLAY_IMAGE=$IMAGE
          PLAY_DATABASE_URL=postgres://play:\$PW@db:5432/maiacity
          PLAY_DATA_PATH=$DATA_MOUNT/play
          EOF2
          set -a; . ./play.env; set +a
          C="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f play/docker-compose.play.yml"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          \$C pull play-api
          # play's role and schema, and its read of the legacy founders for the import
          \$C exec -T db psql -v ON_ERROR_STOP=1 -U maiacity -d maiacity -v pw="'\$PW'" < play/deploy/setup.sql
          \$C up -d --no-deps play-api
          # the import, from avenDB's feed inside the compose network; it writes only what is missing
          \$C run --rm --no-deps -e AVENDB_PUBLIC_FEED=http://avendb:3351/feed play-api bun import/run.ts --cache /data/import-cache --founders --admin 1 --report /data/import-report.md
          \$C exec -T db psql -v ON_ERROR_STOP=1 -U maiacity -d maiacity < play/deploy/after-import.sql
          # Caddy answers play.maia.city: its block added once, the file's inode kept (it is bind-mounted)
          grep -q '>>> play.maia.city' deploy/Caddyfile || cat play/deploy/Caddyfile.play >> deploy/Caddyfile
          \$C exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          docker logout ghcr.io >/dev/null
          EOS
      - name: Check
        run: |
          ssh prod 'for i in 1 2 3 4 5 6; do docker exec maia-city-play bun -e "fetch(\"http://localhost:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && { echo "play-api answers"; docker exec maia-city-play cat /data/import-report.md | head -20; exit 0; }; sleep 5; done; docker logs --tail 80 maia-city-play; exit 1'
