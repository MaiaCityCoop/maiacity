# production: play and the website released (Accept ships it, play/SPEC.md §4.12; Samuel 2026-11-06). release.yml moves
# production fast-forward to a commit of main once main.yml is green for it, and starts this by workflow_dispatch. The
# checks run once, on main: every job's first step after its checkout reads them for the commit (.github/actions/
# main-green), so no job only waits (intent 5ab64b8e). The image, The backup and The website start together; The server
# needs the image and the backup, so nothing on the server changes before play is backed up. play goes to
# play.maia.city (play/SPEC.md §9: deploy/backup.sh, the image, deploy/dns.sh, deploy/server-up.sh), the website to
# maia.city (website/README.md). The server and its constants: deploy/lib.sh, reached by .github/actions/prod-ssh.
name: production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  image:
    name: The image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/main-green
        with:
          token: ${{ github.token }}
          sha: ${{ github.sha }}
      - id: tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-play:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -f play/Dockerfile --build-arg BUN_VERSION="$(cat .bun-version)" --build-arg PLAY_COMMIT="$GITHUB_SHA" -t "${{ steps.tag.outputs.image }}" .
          docker push "${{ steps.tag.outputs.image }}"

  # play's schema and its files to the bucket, with the image that ran with them (deploy/backup.sh stops on a file missing)
  backup:
    name: The backup
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/main-green
        with:
          token: ${{ github.token }}
          sha: ${{ github.sha }}
      - uses: ./.github/actions/prod-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      # play's deploy files to the server in one connection (one tar over ssh: no handshake per file)
      - name: Copy play's files
        run: |
          tar -cf - play/docker-compose.play.yml play/deploy/setup.sql play/deploy/after-import.sql play/deploy/Caddyfile.play \
            deploy/lib.sh deploy/backup.sh deploy/restore.sh | ssh prod "mkdir -p $APP_DIR && tar -xf - --no-same-owner -C $APP_DIR"
      # Only here, on a deploy: nothing runs on a schedule, and the old daily dump's cron is taken away (Samuel
      # 2026-11-02). Restore by hand: restore.yml.
      - name: Back up play
        env:
          S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
        run: |
          bash deploy/bucket-keys.sh
          ssh prod "sudo rm -f /etc/cron.d/maia-city-backup; timeout 1200 bash $APP_DIR/deploy/backup.sh before-deploy-${GITHUB_SHA::7} $GITHUB_SHA </dev/null"

  # play on the server: only once the image is built and play is backed up
  server:
    name: The server
    needs: [image, backup]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/main-green
        with:
          token: ${{ github.token }}
          sha: ${{ github.sha }}
      - name: The server's volume, from the Pulumi state
        id: infra
        run: |
          git fetch --depth=1 origin pulumi-state
          out=$(git show FETCH_HEAD:.pulumi/stacks/maiacity/prod.json | jq -c '.checkpoint.latest.resources[] | select(.type == "pulumi:pulumi:Stack") | .outputs')
          mount=$(jq -r '.dataMount | strings' <<< "$out")
          ipv4=$(jq -r '.ipv4 | strings' <<< "$out")
          [[ -n "$mount" && "$ipv4" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no dataMount or ipv4 in the Pulumi state"; exit 1; }
          echo "data_mount=$mount" >> "$GITHUB_OUTPUT"
          echo "ipv4=$ipv4" >> "$GITHUB_OUTPUT"
      - name: DNS
        env:
          DNS_TOKEN: ${{ secrets.HETZNER_DNS_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HETZNER_API_KEY }}
          IPV4: ${{ steps.infra.outputs.ipv4 }}
        run: bash deploy/dns.sh set play "$IPV4"
      - uses: ./.github/actions/prod-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Start play-api, import, and answer play.maia.city
        env:
          DATA_MOUNT: ${{ steps.infra.outputs.data_mount }}
          IMAGE: ${{ needs.image.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          # play's files live in the bucket (blobs/<xx>/<hash>), not on the server's disk
          S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          # Accept ships it (play/api/src/ship.ts): play merges an accepted intent's pull request and follows it to
          # production with this fine-grained token (deploy/README.md); without it, Accept on code says so
          SHIP_TOKEN: ${{ secrets.SHIP_TOKEN }}
          SHIP_REPO: ${{ github.repository }}
        run: |
          [ -n "$SHIP_TOKEN" ] || echo "::warning::No SHIP_TOKEN: play cannot merge an accepted intent's pull request (deploy/README.md)."
          { for v in DATA_MOUNT IMAGE GHCR_TOKEN ACTOR S3_ACCESS_KEY S3_SECRET_KEY SHIP_TOKEN SHIP_REPO; do printf '%s=%q\n' "$v" "${!v}"; done
            cat deploy/server-up.sh; } | ssh prod "cd $APP_DIR && bash -s"
      - name: Check
        run: |
          ssh prod "cd $APP_DIR && bash -s" <<'EOS'
          . deploy/lib.sh
          if answers "$PLAY_CONTAINER" 6 5; then echo "play-api answers"; docker exec "$PLAY_CONTAINER" cat /data/import-report.md | head -20; exit 0; fi
          docker logs --tail 80 "$PLAY_CONTAINER"; exit 1
          EOS
      - name: play.maia.city answers over HTTPS
        run: |
          # Caddy fetches the certificate on its own after the reload; wait for it, and on failure show what Caddy says
          for i in $(seq 1 24); do
            curl -fsS -m 10 -o /dev/null https://play.maia.city/api/health && { echo "https://play.maia.city answers"; exit 0; }
            sleep 10
          done
          ssh prod "cd $APP_DIR && bash -s" <<'EOS'
          . deploy/lib.sh
          echo "play blocks Caddy reads: $(docker exec "$CADDY_CONTAINER" grep -c ">>> play.maia.city" /etc/caddy/Caddyfile)"
          docker exec "$CADDY_CONTAINER" caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile 2>/dev/null | grep -o "play.maia.city" | head -1
          docker logs --since 30m "$CADDY_CONTAINER" 2>&1 | grep -iE "play.maia.city|error" | tail -40
          EOS
          exit 1

  # its prerendered build into the server's site/releases/<commit>; deploy/publish-site.py switches site/current to it
  # atomically and keeps the last releases (their hashed chunks stay reachable for open pages). Nothing restarts.
  website:
    name: The website
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/main-green
        with:
          token: ${{ github.token }}
          sha: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Build
        working-directory: website
        run: |
          bun install --frozen-lockfile
          bun run build
          tar -czf "$RUNNER_TEMP/site.tgz" -C build .
      - uses: ./.github/actions/prod-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Put the build on the server and switch to it
        run: |
          ssh prod "mkdir -p $APP_DIR/site/releases/$GITHUB_SHA"
          ssh prod "tar -xzf - -C $APP_DIR/site/releases/$GITHUB_SHA" < "$RUNNER_TEMP/site.tgz"
          ssh prod "python3 - '$APP_DIR/site' '$GITHUB_SHA'" < deploy/publish-site.py
      - name: maia.city answers with it
        run: |
          for i in $(seq 1 12); do
            curl -fsS -m 10 -o /dev/null https://maia.city/ && { echo "https://maia.city answers"; exit 0; }
            sleep 5
          done
          exit 1
