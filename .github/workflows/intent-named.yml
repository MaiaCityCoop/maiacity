# Intent named (play/SPEC.md §4.12, "Every pull request names its one intent"; Samuel 2026-11-06): a required check of
# main's ruleset. Every pull request into main is the work of exactly one intent, named by its full UUID on a line
# `Intent: <uuid>` in its body and its commits (its title shows the first 8 characters, only shown); the intent at
# Build, Proposal or Ship; and the intent's one active pull request while that one is open. The logic is
# play/avenbox/pr-intent.ts, main's own: on pull_request_target this workflow and that file are always main's, and the
# pull request is only read through GitHub's API, never checked out. It reads play with avenBOX's token
# (PLAY_MCP_TOKEN), never handed to anything of the pull request's.
name: intent named

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: intent-named-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  named:
    name: Intent named
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Not from a fork
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error title=Intent named::A pull request from a fork names no intent of play's: an agent of Maia City opens it from a branch of this repository."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: play/avenbox
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: The pull request names its one intent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAY_MCP_TOKEN: ${{ secrets.PLAY_MCP_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: bun play/avenbox/pr-intent.ts "$PR"
