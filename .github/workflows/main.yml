# main: play's checks (play/SPEC.md), on a pull request to main and on what lands there. The API's tests against a real
# Postgres, its types, and the site's build. A draft runs nothing (the repository's rule); marking it ready runs them.
name: main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    if: github.event_name == 'push' || !github.event.pull_request.draft
    uses: ./.github/workflows/play-checks.yml

  # the check production's and main's rules require, named exactly "play": green only when play's checks are (a job
  # skipped because another failed would count as passed, so it always runs and says what they did)
  play:
    name: play
    needs: checks
    if: always() && (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: play's checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "play's checks: $RESULT"
          [ "$RESULT" = success ]
