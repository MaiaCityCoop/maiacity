# main: play's and the website's checks, on a pull request to main, on each merge group of main's merge queue (intent
# f7721142: GitHub runs them on the group's commit and fast-forwards main to it once they pass) and on what lands there.
# play's (play/SPEC.md): the API's tests against a real Postgres, its types, and the site's build; the website's
# (website/): its types and build. A draft runs nothing (the repository's rule); marking it ready runs them.
name: main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# the called checks read, on a push, whether the merge queue's run passed on the pushed commit (./tested-tree.sh)
permissions:
  contents: read
  actions: read

# one group per pull request and its draft state: a draft's run (its jobs skipped) never cancels the ready one, and two
# ready pushes still do (intent 28d9f33b); each merge group has a ref of its own and is never cancelled
concurrency:
  group: main-${{ github.ref }}-${{ github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  play:
    name: play
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/play-checks.yml

  website:
    name: website
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/website-checks.yml
