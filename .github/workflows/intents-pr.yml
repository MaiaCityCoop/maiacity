# An intent's checks on its pull request, in avenBOX on GitHub (play/SPEC.md §4.12, "Build is fast and untrusted;
# ready promotes to Proposal", "Only the box's run is evidence"; Samuel 2026-11-06). While the intent is in Build its
# pull request is a draft, and nothing runs here: the agent tests itself, anywhere (play/avenbox/intent.ts without
# --record). Marking it ready for review runs the intent's checks in the box (play/avenbox/setup.sh, PostgreSQL 17,
# bun 1.4.4) on the pull request's head and records them on the intent with that head, this run's link and the pull
# request (which becomes the intent's active one): every must green, the intent moves to Proposal; any must red, it
# stays in (or goes back to) Build, failed on the board, its pull request as it is. A new head (a push, play's
# main-merge) cancels the older head's run, which records nothing (play/api/src/ship.ts).
#
# Only the box's run is evidence: on pull_request_target this file is main's, and so is the intent.ts that holds a
# token. Four jobs:
#   spec    main's pr-intent.ts and intent.ts, with avenBOX's token (PLAY_MCP_TOKEN): which intent, and its spec
#   main    main's measures (intent f63774a3): main's code only, never the head's. Main is the merge base of main and
#           the head; play/avenbox/vs-main.ts measures it for every vs-main call in the spec, kept in GitHub's cache
#           by that commit (so main is measured once per main commit) and handed to the run job, which only reads it
#   run     the pull request's head, checked out without credentials, no secret, a read-only GITHUB_TOKEN: main's
#           intent.ts (handed over by spec) runs the spec's checks there and writes their results
#   record  main's intent.ts, with avenBOX's token: records the results (only if they ran on the head), skipped if cancelled
# Heads in this repository only: a fork's pull request runs nothing here.
name: intents on pull requests

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: intents-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  spec:
    name: the intent's spec
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      intent: ${{ steps.which.outputs.intent }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: The intent it names, and its spec (main's code, avenBOX's token)
        id: which
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAY_MCP_TOKEN: ${{ secrets.PLAY_MCP_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -n "$PLAY_MCP_TOKEN" ] || { echo "::error::The repository secret PLAY_MCP_TOKEN (avenBOX's token) is not set"; exit 1; }
          intent=$(bun play/avenbox/pr-intent.ts "$PR" --id)
          echo "intent=$intent" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/box"
          bun play/avenbox/intent.ts "$intent" --spec-out "$RUNNER_TEMP/box/spec.json"
          cp play/avenbox/intent.ts "$RUNNER_TEMP/box/intent.ts"
      - uses: actions/upload-artifact@v4
        with:
          name: box-spec
          path: ${{ runner.temp }}/box
          retention-days: 7

  main:
    name: main's measures
    needs: spec
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: box-spec
          path: ${{ runner.temp }}/box
      - name: Main, the merge base of main and the head (the head's commits fetched, never checked out)
        id: base
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --quiet origin "$HEAD_SHA"
          base=$(git merge-base HEAD "$HEAD_SHA")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if grep -q 'vs-main\.ts' "$RUNNER_TEMP/box/spec.json"; then echo "measures=yes" >> "$GITHUB_OUTPUT"; fi
          echo "calls=$(grep -o 'vs-main\.ts[^"]*' "$RUNNER_TEMP/box/spec.json" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.base.outputs.measures
        with:
          path: ${{ runner.temp }}/vs-main
          key: vs-main-${{ steps.base.outputs.base }}-${{ steps.base.outputs.calls }}
          restore-keys: vs-main-${{ steps.base.outputs.base }}-
      - uses: oven-sh/setup-bun@v2
        if: steps.base.outputs.measures
        with:
          bun-version: 1.4.4
      - name: Main measured, or read from the cache (main's vs-main.ts)
        if: steps.base.outputs.measures
        env:
          VS_MAIN_CACHE: ${{ runner.temp }}/vs-main
          BASE: ${{ steps.base.outputs.base }}
        run: |
          (cd play/site && bun install --frozen-lockfile > /dev/null)
          bun play/avenbox/vs-main.ts --main-of "$RUNNER_TEMP/box/spec.json" --main "$BASE"
      - name: Nothing to measure
        if: "!steps.base.outputs.measures"
        run: mkdir -p "$RUNNER_TEMP/vs-main" && touch "$RUNNER_TEMP/vs-main/.none"
      - uses: actions/upload-artifact@v4
        with:
          name: vs-main
          path: ${{ runner.temp }}/vs-main
          include-hidden-files: true
          retention-days: 7

  run:
    name: the checks in avenBOX
    needs: [spec, main]
    # main's measures failing leaves the head's vs-main to measure main itself
    if: "!cancelled() && needs.spec.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: box-spec
          path: ${{ runner.temp }}/box
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vs-main
          path: ${{ runner.temp }}/vs-main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: avenBOX (play/avenbox/setup.sh)
        run: sudo env "PATH=$PATH" bash play/avenbox/setup.sh
      - name: The intent's checks on the head (no token; main's measures read from the main job's)
        env:
          VS_MAIN_CACHE: ${{ runner.temp }}/vs-main
          VS_MAIN: ${{ needs.main.outputs.base }}
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          bun "$RUNNER_TEMP/box/intent.ts" --from "$RUNNER_TEMP/box/spec.json" --results-out "$RUNNER_TEMP/results/results.json" --root "$GITHUB_WORKSPACE" || echo "a must check failed: recorded as it ran"
      - uses: actions/upload-artifact@v4
        with:
          name: box-results
          path: ${{ runner.temp }}/results/results.json
          retention-days: 30

  record:
    name: recorded on the intent
    needs: [spec, run]
    if: "!cancelled() && needs.spec.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: play/avenbox
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        if: needs.run.result == 'success'
        with:
          name: box-results
          path: ${{ runner.temp }}/results
      - name: The results, recorded with the head, this run's link and the pull request (main's code, avenBOX's token)
        id: recorded
        env:
          PLAY_MCP_TOKEN: ${{ secrets.PLAY_MCP_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          INTENT: ${{ needs.spec.outputs.intent }}
        run: |
          [ -f "$RUNNER_TEMP/results/results.json" ] || { echo "::error::The checks did not run to the end: nothing recorded"; exit 1; }
          bun play/avenbox/intent.ts "$INTENT" --record-from "$RUNNER_TEMP/results/results.json" --pr "$PR" --head "$HEAD"
