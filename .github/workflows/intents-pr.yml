# An intent's checks on its pull request, in avenBOX on GitHub (play/SPEC.md §4.12, "Build is fast and untrusted;
# ready promotes to Proposal", "Only the box's run is evidence"; Samuel 2026-11-06). While the intent is in Build its
# pull request is a draft, and nothing runs here: the agent tests itself, anywhere (play/avenbox/intent.ts without
# --record). Marking it ready for review runs the intent's checks in the box (play/avenbox/setup.sh, PostgreSQL 17,
# bun as .bun-version names it) on the pull request's head and records them on the intent with that head, this run's link and the pull
# request (which becomes the intent's active one): every must green, the intent moves to Proposal; any must red, it
# stays in (or goes back to) Build, failed on the board, its pull request as it is. A new head (a push, play's
# main-merge) cancels the older head's run, which records nothing (play/api/src/ship.ts).
#
# Only the box's run is evidence: on pull_request_target this file is main's, and so is the intent.ts that holds a
# token. Six jobs; main, run and gpu side by side once spec is done (intent 006eb26a: about 3 minutes, not 6 to 12):
#   spec     main's pr-intent.ts and intent.ts, with avenBOX's token (PLAY_MCP_TOKEN): which intent, and its spec
#   main     main's measures (intents f63774a3, 006eb26a): no secret. Main is the merge base of main and the head (GitHub's
#            compare: no history fetched), checked out alone at depth 1, sparse (the paths vs-main measures); main's
#            vs-main.ts measures it for every vs-main call in the spec, kept in GitHub's cache by what those calls read
#            (so main is measured again only when that changed)
#   run      the pull request's head, checked out without credentials, no secret, a read-only GITHUB_TOKEN: main's
#            intent.ts (handed over by spec) runs the spec's checks there and writes their results; a vs-main call
#            measures the head only (VS_MAIN_HEAD_OUT), its bound decided by compare
#   gpu      only when a check's run names play/site/scripts/gpu.ts (intent ba948167): the head as in run (no
#            credentials, no secret, a read-only GITHUB_TOKEN) on GitHub's macOS runner, Apple silicon and Metal, where
#            main's intent.ts runs those checks alone (--gpu): a world's look, its time to the world and its frame time
#            in Chromium and WebKit, from pinned inputs. The box has no GPU and refuses them (failed, saying so);
#            compare puts the runner's results in their place
#   compare  main's vs-main.ts, no secret: each of the head's vs-main calls against main's measures, into its check's
#            result and evidence (--fold), once both are measured; nothing is recorded before it
#   record   main's intent.ts, with avenBOX's token: records the results (only if they ran on the head), skipped if cancelled
# Heads in this repository only: a fork's pull request runs nothing here.
# workflow_dispatch (a pull request's number) is a dry run of this file and the branch's own vs-main.ts and intent.ts
# as dispatched, to time it before it is main's (`intent`: another intent's spec on that head, e.g. one with a census):
# it records nothing, and the token stays in spec with main's code.
name: intents on pull requests

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: the pull request's number (a dry run, recording nothing)
        required: true
        type: number
      intent:
        description: another intent's UUID whose spec runs on that head instead of its own (to time a spec it hasn't)
        required: false
        type: string

permissions: {}

concurrency:
  group: intents-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  spec:
    name: the intent's spec
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      intent: ${{ steps.which.outputs.intent }}
      head: ${{ steps.which.outputs.head }}
      gpu: ${{ steps.which.outputs.gpu }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: The intent it names, and its spec (main's code, avenBOX's token)
        id: which
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PLAY_MCP_TOKEN: ${{ secrets.PLAY_MCP_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRY: ${{ github.event_name == 'workflow_dispatch' }}
          OTHER: ${{ inputs.intent }}
        run: |
          [ -n "$PLAY_MCP_TOKEN" ] || { echo "::error::The repository secret PLAY_MCP_TOKEN (avenBOX's token) is not set"; exit 1; }
          if [ "$DRY" = true ] && [ -n "$OTHER" ]; then
            [[ "$OTHER" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::intent is a UUID"; exit 1; }
            intent=$OTHER
          else
            intent=$(bun play/avenbox/pr-intent.ts "$PR" --id)
          fi
          echo "intent=$intent" >> "$GITHUB_OUTPUT"
          [ "$DRY" != true ] || HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head for pull request $PR"; exit 1; }
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/box"
          bun play/avenbox/intent.ts "$intent" --spec-out "$RUNNER_TEMP/box/spec.json"
          cp play/avenbox/intent.ts play/avenbox/play.ts play/avenbox/box.env "$RUNNER_TEMP/box/"
          # a check that measures on a real GPU names the one script that does: the gpu job runs only then
          ! jq -e '[.checks[].run // ""] | any(test("\\bscripts/gpu\\.ts\\b"))' "$RUNNER_TEMP/box/spec.json" > /dev/null || echo "gpu=true" >> "$GITHUB_OUTPUT"
          # a dry run hands over the dispatched branch's intent.ts (and what it reads beside it), read with git show, never run here
          if [ "$DRY" = true ]; then git fetch --quiet --depth=1 origin "$GITHUB_SHA" && git show "$GITHUB_SHA:play/avenbox/intent.ts" > "$RUNNER_TEMP/box/intent.ts" && git show "$GITHUB_SHA:play/avenbox/play.ts" > "$RUNNER_TEMP/box/play.ts" && git show "$GITHUB_SHA:play/avenbox/box.env" > "$RUNNER_TEMP/box/box.env"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: box-spec
          path: ${{ runner.temp }}/box
          retention-days: 7

  main:
    name: main's measures
    needs: spec
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: box-spec
          path: ${{ runner.temp }}/box
      - name: Main, the merge base of main and the head (GitHub's compare, no history fetched)
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ needs.spec.outputs.head }}
        run: |
          grep -q 'vs-main\.ts' "$RUNNER_TEMP/box/spec.json" || exit 0
          base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$MAIN...$HEAD_SHA" --jq .merge_base_commit.sha)
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no merge base of $MAIN and $HEAD_SHA"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
      # main's code: vs-main.ts and what it imports (a dry run: the dispatched branch's)
      - uses: actions/checkout@v4
        if: steps.base.outputs.base
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          path: code
          persist-credentials: false
          sparse-checkout: |
            play/avenbox
            play/site/scripts/census
      # main as measured: the merge base alone, at depth 1, the paths a census reads (all of it for a count)
      - uses: actions/checkout@v4
        if: steps.base.outputs.base
        with:
          ref: ${{ steps.base.outputs.base }}
          path: base
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            play/site
            play/api/src
      - uses: oven-sh/setup-bun@v2
        if: steps.base.outputs.base
        with:
          bun-version: 1.4.4
      - name: The cache's key, by what the calls read at main
        id: key
        if: steps.base.outputs.base
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          if grep -Eq 'vs-main\.ts +count' "$RUNNER_TEMP/box/spec.json"; then git -C base sparse-checkout disable; fi
          echo "key=$(bun code/play/avenbox/vs-main.ts --key-of "$RUNNER_TEMP/box/spec.json" --main "$BASE" --repo base)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.base.outputs.base
        with:
          path: ${{ runner.temp }}/vs-main-cache
          key: vs-main-${{ steps.key.outputs.key }}
          restore-keys: vs-main-
      - name: Main measured in its own checkout, or read from the cache (main's vs-main.ts)
        if: steps.base.outputs.base
        env:
          VS_MAIN_CACHE: ${{ runner.temp }}/vs-main-cache
          BASE: ${{ steps.base.outputs.base }}
        run: |
          (cd base/play/site && bun install --frozen-lockfile > /dev/null)
          bun code/play/avenbox/vs-main.ts --main-of "$RUNNER_TEMP/box/spec.json" --main "$BASE" --repo base --out "$RUNNER_TEMP/vs-main/main.json"
      - name: Nothing to measure
        if: "!steps.base.outputs.base"
        run: mkdir -p "$RUNNER_TEMP/vs-main" && echo '{"side":"main","sha":null,"measures":{}}' > "$RUNNER_TEMP/vs-main/main.json"
      - uses: actions/upload-artifact@v4
        with:
          name: vs-main
          path: ${{ runner.temp }}/vs-main
          retention-days: 7

  run:
    name: the checks in avenBOX
    # beside main's measures, not after them: the head's vs-main calls measure the head only
    needs: spec
    if: "!cancelled() && needs.spec.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.spec.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: box-spec
          path: ${{ runner.temp }}/box
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Postgres (CI's container)
        # the PostgreSQL CI runs (play-checks.yml), from main's box.env, ready in seconds: setup.sh then installs none and
        # waits on no mirror (intent a3c81d24; apt.postgresql.org once held a run's setup for 15 minutes)
        run: |
          . "$RUNNER_TEMP/box/box.env"
          docker run -d --name postgres -e POSTGRES_PASSWORD="$PG_PASSWORD" -p "$PG_PORT:5432" "postgres:$PG_VERSION-alpine" -c "max_connections=$PG_MAX_CONNECTIONS"
          # over TCP: the image's first start (initdb) answers only on its socket until it is ready
          for i in $(seq 1 60); do docker exec postgres pg_isready -h 127.0.0.1 -U postgres > /dev/null && break; sleep 1; done
          docker exec postgres pg_isready -h 127.0.0.1 -U postgres
      - name: avenBOX (play/avenbox/setup.sh)
        run: sudo env "PATH=$PATH" bash play/avenbox/setup.sh
      - name: The intent's checks on the head (no token)
        env:
          VS_MAIN_HEAD_OUT: ${{ runner.temp }}/vs-head
        run: |
          mkdir -p "$RUNNER_TEMP/results" "$RUNNER_TEMP/vs-head" && touch "$RUNNER_TEMP/vs-head/.none"
          bun "$RUNNER_TEMP/box/intent.ts" --from "$RUNNER_TEMP/box/spec.json" --results-out "$RUNNER_TEMP/results/results.json" --root "$GITHUB_WORKSPACE" || echo "a must check failed: recorded as it ran"
      - uses: actions/upload-artifact@v4
        with:
          name: box-results
          path: ${{ runner.temp }}/results/results.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: vs-head
          path: ${{ runner.temp }}/vs-head
          include-hidden-files: true
          retention-days: 7

  gpu:
    name: the checks on a GPU
    # beside the box's checks, and only when the spec asks for a GPU: GitHub's macOS runner (Apple silicon, Metal)
    needs: spec
    if: "!cancelled() && needs.spec.result == 'success' && needs.spec.outputs.gpu == 'true'"
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.spec.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: box-spec
          path: ${{ runner.temp }}/box
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: The site's dependencies, its browsers and its build
        working-directory: play/site
        run: |
          bun install --frozen-lockfile
          bunx playwright install chromium webkit
          bun run build
      - name: The intent's GPU checks on the head (no token)
        env:
          GPU_OUT: ${{ runner.temp }}/gpu-pictures
        run: |
          mkdir -p "$RUNNER_TEMP/gpu-results" "$GPU_OUT"
          bun "$RUNNER_TEMP/box/intent.ts" --from "$RUNNER_TEMP/box/spec.json" --gpu --no-up --results-out "$RUNNER_TEMP/gpu-results/results.json" --root "$GITHUB_WORKSPACE" || echo "a must check failed: recorded as it ran"
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-results
          path: ${{ runner.temp }}/gpu-results/results.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-pictures
          path: ${{ runner.temp }}/gpu-pictures
          retention-days: 30

  compare:
    name: main and the head compared
    needs: [spec, main, run, gpu]
    # main's measures failing fails each check that needed them, saying so; the head's checks failing records them
    if: "!cancelled() && needs.run.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            play/avenbox
            play/site/scripts/census
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: box-results
          path: ${{ runner.temp }}/results
      - uses: actions/download-artifact@v4
        with:
          name: vs-head
          path: ${{ runner.temp }}/vs-head
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vs-main
          path: ${{ runner.temp }}/vs-main
      - uses: actions/download-artifact@v4
        if: needs.spec.outputs.gpu == 'true'
        continue-on-error: true
        with:
          name: gpu-results
          path: ${{ runner.temp }}/gpu-results
      - name: The GPU runner's results in place of the box's refusals (main's intent.ts, no token)
        if: needs.spec.outputs.gpu == 'true'
        run: bun play/avenbox/intent.ts --over "$RUNNER_TEMP/results/results.json" --with "$RUNNER_TEMP/gpu-results/results.json"
      - name: The head's vs-main calls against main's measures, into their checks (main's vs-main.ts, no token)
        run: bun play/avenbox/vs-main.ts --fold "$RUNNER_TEMP/results/results.json" --main-values "$RUNNER_TEMP/vs-main/main.json" --heads "$RUNNER_TEMP/vs-head" --out "$RUNNER_TEMP/compared/results.json"
      - uses: actions/upload-artifact@v4
        with:
          name: box-compared
          path: ${{ runner.temp }}/compared/results.json
          retention-days: 30

  record:
    name: recorded on the intent
    needs: [spec, compare]
    # a dry run (workflow_dispatch) records nothing
    if: "github.event_name == 'pull_request_target' && !cancelled() && needs.spec.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: play/avenbox
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v4
        if: needs.compare.result == 'success'
        with:
          name: box-compared
          path: ${{ runner.temp }}/results
      - name: The results, recorded with the head, this run's link and the pull request (main's code, avenBOX's token)
        id: recorded
        env:
          PLAY_MCP_TOKEN: ${{ secrets.PLAY_MCP_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ needs.spec.outputs.head }}
          INTENT: ${{ needs.spec.outputs.intent }}
        run: |
          [ -f "$RUNNER_TEMP/results/results.json" ] || { echo "::error::The checks did not run to the end: nothing recorded"; exit 1; }
          bun play/avenbox/intent.ts "$INTENT" --record-from "$RUNNER_TEMP/results/results.json" --pr "$PR" --head "$HEAD"
