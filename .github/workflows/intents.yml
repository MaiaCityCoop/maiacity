# intents on main (play/SPEC.md §4.12, "Checks run in avenBOX, and again on main"; Samuel 2026-11-06): once an
# intent's work is merged, main runs the intent's checks again in the same box the agent built it in (avenBOX:
# play/avenbox/setup.sh, PostgreSQL 17, the same TEST_DATABASE_URL) on the merged commit, and records each result on
# the intent as main's (play/avenbox/intent.ts --record --where main), whatever its stage: a confirmation, as an intent
# is accepted and shipped on its checks on its pull request's head (play/api/src/ship.ts). Which intents: the
# `Intent: <uuid>` trailers of the commits the push brought, or, run by hand, the one given (on main's head). It records
# and never blocks: production.yml's jobs read only main.yml's checks (.github/actions/main-green). PLAY_MCP_TOKEN is an admin's play
# access token (play's profile page), a repository secret; only intent.ts holds it, no check's command sees it.
name: intents on main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      intent:
        description: "the intent's id (a UUID): its checks run on main's head and are recorded as main's"
        required: true

permissions:
  contents: read

concurrency:
  group: intents-${{ github.sha }}

jobs:
  checks:
    name: intents' checks on main
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The intents this push names
        id: which
        env:
          GIVEN: ${{ inputs.intent }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # the trailer as play/api/src/kit/ids.ts TRAILER reads it (a grep: spaces only, one line; bun is not set up yet here)
          uuid='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          if [ -n "$GIVEN" ]; then
            echo "$GIVEN" | grep -qxE "$uuid" || { echo "::error::An intent is named by its id, a UUID: $GIVEN"; exit 1; }
            ids=$GIVEN
          else
            if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then range="$BEFORE..$AFTER"; else range="-1 $AFTER"; fi
            ids=$(git log --format=%B $range | grep -iE "^Intent: *$uuid *$" | grep -oiE "$uuid" | tr 'A-F' 'a-f' | sort -u | xargs)
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          if [ -n "$ids" ]; then echo "intents: $ids"; else echo "no Intent: trailer in this push: nothing to run"; fi
      - uses: oven-sh/setup-bun@v2
        if: steps.which.outputs.ids != ''
        with:
          bun-version-file: .bun-version
      - name: avenBOX (play/avenbox/setup.sh)
        if: steps.which.outputs.ids != ''
        run: sudo env "PATH=$PATH" bash play/avenbox/setup.sh
      - name: Each intent's checks, recorded as main's
        if: steps.which.outputs.ids != ''
        env:
          IDS: ${{ steps.which.outputs.ids }}
          PLAY_MCP_TOKEN: ${{ secrets.PLAY_MCP_TOKEN }}
        run: |
          [ -n "$PLAY_MCP_TOKEN" ] || { echo "::error::The repository secret PLAY_MCP_TOKEN is not set: nothing can be recorded"; exit 1; }
          red=0
          for id in $IDS; do
            echo "::group::intent $id"
            bun play/avenbox/intent.ts "$id" --record --where main || red=1
            echo "::endgroup::"
          done
          exit $red
