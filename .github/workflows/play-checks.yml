# play's checks, called by main.yml: avenBOX's gate (play/avenbox/gate.sh) for the API, its types and its tests against a
# real Postgres (play/api/test), and for the site's build (play/site), which also holds the copied modules to resolving.
#
# On a pull request they always run in full, and end by noting the tree they tested ("Tested tree"). On a push to main
# (intent 5ab64b8e) they pass without running again only when the pushed tree is that very tree, for the pull request
# merged as the commit (./tested-tree.sh asks GitHub's API); anything else, or any doubt, runs them in full. Postgres is
# started only when they run.
name: play checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: API and site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: The tested tree
        id: tested
        if: github.event_name == 'push'
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PART: play
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/tested-tree.sh
      - name: Postgres
        if: steps.tested.outputs.skip != 'true'
        # avenBOX's version, password, port and room for the tests in parallel (play/avenbox/box.env)
        run: |
          . play/avenbox/box.env
          docker run -d --name postgres -e POSTGRES_PASSWORD="$PG_PASSWORD" -p "$PG_PORT:5432" "postgres:$PG_VERSION-alpine" -c "max_connections=$PG_MAX_CONNECTIONS"
          echo "TEST_DATABASE_URL=$BOX_DATABASE_URL" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        if: steps.tested.outputs.skip != 'true'
        with:
          bun-version-file: .bun-version
      - name: The API
        if: steps.tested.outputs.skip != 'true'
        working-directory: play/api
        run: |
          bun install --frozen-lockfile
          # over TCP: the image's first start (initdb) answers only on its socket until it is ready
          for i in $(seq 1 60); do docker exec postgres pg_isready -h 127.0.0.1 -U postgres > /dev/null && break; sleep 1; done
          docker exec postgres pg_isready -h 127.0.0.1 -U postgres
          # avenBOX's gate, the part whole: its types, then every test file in parallel, red if one is skipped
          bash ../avenbox/gate.sh api --no-up
      - name: The site
        if: steps.tested.outputs.skip != 'true'
        working-directory: play/site
        run: |
          bun install --frozen-lockfile
          bash ../avenbox/gate.sh site --no-up
      - name: Tested tree
        if: steps.tested.outputs.skip != 'true'
        run: echo "::notice title=Tested tree::$(git rev-parse 'HEAD^{tree}')"
