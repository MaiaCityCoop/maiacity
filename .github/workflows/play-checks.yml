# play's checks, called by main.yml: the API's tests against a real Postgres (play/api/test), its types, and the site's
# build (play/site), which also holds the copied modules to resolving, and its tests (intent 417af727): the site's fast
# suite (`bun run test`: every file but Sandbox 2's physics) in two parts. Its vitest part starts at the job's beginning,
# in the background beside the API's tests and the build, on one worker at the lowest priority (the API's tests time out
# at 5 s when the cores are shared more), and is awaited at the job's end; its Bun part (`bun run test:bun`, the Old City
# film's world on Bun's workers, ~95 s on every core) runs then. Sandbox 2's physics (`bun run test:physics`, about ten
# minutes) is its own job, not a required check: on a pull request that touches play/site/src/lib/sandbox-2/, and on
# every push to main.
#
# On a pull request they always run in full, and end by noting the tree they tested ("Tested tree"). On a push to main
# (intent 5ab64b8e) they pass without running again only when the pushed tree is that very tree, for the pull request
# merged as the commit (./tested-tree.sh asks GitHub's API); anything else, or any doubt, runs them in full. Postgres is
# started only when they run.
name: play checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: API and site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: The tested tree
        id: tested
        if: github.event_name == 'push'
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CHECK: play / API and site
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/tested-tree.sh
      - name: Postgres
        if: steps.tested.outputs.skip != 'true'
        # room for the tests in parallel (intent aa59f248): each test file's pool and each play-api a test starts take up to 20
        run: docker run -d --name postgres -e POSTGRES_PASSWORD=play -p 5432:5432 postgres:17-alpine -c max_connections=500
      - uses: oven-sh/setup-bun@v2
        if: steps.tested.outputs.skip != 'true'
        with:
          bun-version: 1.4.4
      # the site's fast suite's vitest part, in the background: its output and exit code kept for "The site's tests" to
      # await. One worker at the lowest priority, so the API's tests beside it keep the cores they need
      - name: The site's tests, started
        if: steps.tested.outputs.skip != 'true'
        working-directory: play/site
        run: |
          bun install --frozen-lockfile
          bunx svelte-kit sync
          nohup nice -n 19 bash -c 'bun run test:vitest --maxWorkers=1 > "$RUNNER_TEMP/site-tests.log" 2>&1; echo $? > "$RUNNER_TEMP/site-tests.exit"' > /dev/null 2>&1 &
      - name: The API
        if: steps.tested.outputs.skip != 'true'
        working-directory: play/api
        env:
          TEST_DATABASE_URL: postgres://postgres:play@localhost:5432/postgres
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit -p .
          # over TCP: the image's first start (initdb) answers only on its socket until it is ready
          for i in $(seq 1 60); do docker exec postgres pg_isready -h 127.0.0.1 -U postgres > /dev/null && break; sleep 1; done
          docker exec postgres pg_isready -h 127.0.0.1 -U postgres
          # the whole suite, every file, one worker per core (each file its own database; intent aa59f248)
          bun test --parallel
      - name: The site
        if: steps.tested.outputs.skip != 'true'
        working-directory: play/site
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: The site's tests
        if: steps.tested.outputs.skip != 'true'
        working-directory: play/site
        run: |
          start=$SECONDS
          until [ -f "$RUNNER_TEMP/site-tests.exit" ]; do sleep 2; done
          cat "$RUNNER_TEMP/site-tests.log"
          echo "the site's vitest part: awaited $((SECONDS - start)) s after the build"
          [ "$(cat "$RUNNER_TEMP/site-tests.exit")" = 0 ] || exit 1
          bun run test:bun
      - name: Tested tree
        if: steps.tested.outputs.skip != 'true'
        run: echo "::notice title=Tested tree::$(git rev-parse 'HEAD^{tree}')"

  physics:
    name: Sandbox 2's physics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Whether it runs
        id: touched
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # every push to main runs them; a pull request only when it changes Sandbox 2's code (its files against the
          # merge base, as GitHub lists them)
          if [ "$EVENT" = push ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "a push to main: the physics run"; exit 0; fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if echo "$files" | grep -q '^play/site/src/lib/sandbox-2/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "play/site/src/lib/sandbox-2/ changed: the physics run"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "nothing of Sandbox 2's changed: the physics don't run"
          fi
      - uses: actions/checkout@v4
        if: steps.touched.outputs.run == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.touched.outputs.run == 'true'
        with:
          bun-version: 1.4.4
      - name: The physics
        if: steps.touched.outputs.run == 'true'
        working-directory: play/site
        run: |
          bun install --frozen-lockfile
          bun run test:physics
