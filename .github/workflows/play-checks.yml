# play's checks, called by main.yml: the API's tests against a real Postgres (play/api/test), its types, and the site's
# build (play/site), which also holds the copied modules to resolving, and its tests (intent 417af727).
#
# Each on a runner of its own, in parallel (they starved each other's 5 s timeouts on one): the job "API" (Postgres,
# the API's types and its whole suite, alone), the job "Site" (its build, then its fast suite: vitest without Sandbox
# 2's physics, then its *.bun.test.ts with Bun), and Sandbox 2's physics (`bun run test:physics`, its own job and check,
# on a pull request that touches play/site/src/lib/sandbox-2/ and on every push to main; not in the required check:
# on main it would hold it past the 13 minutes production's Main is green waits). The required check keeps its name:
# the job "API and site" needs "API" and "Site" and is green only when both are.
#
# On a pull request they always run in full, and end by noting the tree they tested ("Tested tree"). On a push to main
# (intent 5ab64b8e) they pass without running again only when the pushed tree is that very tree, for the pull request
# merged as the commit (./tested-tree.sh asks GitHub's API); anything else, or any doubt, runs them in full. Postgres is
# started only when they run.
name: play checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tested:
    name: The tested tree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      skip: ${{ steps.tested.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: The tested tree
        id: tested
        if: github.event_name == 'push'
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PART: play
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/tested-tree.sh

  api:
    name: API
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Postgres
        # avenBOX's version, password, port and room for the tests in parallel (play/avenbox/box.env)
        run: |
          . play/avenbox/box.env
          docker run -d --name postgres -e POSTGRES_PASSWORD="$PG_PASSWORD" -p "$PG_PORT:5432" "postgres:$PG_VERSION-alpine" -c "max_connections=$PG_MAX_CONNECTIONS"
          echo "TEST_DATABASE_URL=$BOX_DATABASE_URL" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: The API
        working-directory: play/api
        run: |
          bun install --frozen-lockfile
          # over TCP: the image's first start (initdb) answers only on its socket until it is ready
          for i in $(seq 1 60); do docker exec postgres pg_isready -h 127.0.0.1 -U postgres > /dev/null && break; sleep 1; done
          docker exec postgres pg_isready -h 127.0.0.1 -U postgres
          # avenBOX's gate, the part whole: its types, then every test file in parallel, red if one is skipped
          bash ../avenbox/gate.sh api --no-up

  site:
    name: Site
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: The site
        working-directory: play/site
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: The site's tests
        working-directory: play/site
        # the fast suite: vitest without Sandbox 2's physics, then the *.bun.test.ts with Bun
        run: bun run test

  checks:
    name: API and site
    needs: [tested, api, site]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The API's and the site's jobs
        env:
          TESTED: ${{ needs.tested.result }}
          SKIP: ${{ needs.tested.outputs.skip }}
          API: ${{ needs.api.result }}
          SITE: ${{ needs.site.result }}
        run: |
          echo "the tested tree: $TESTED (skip: ${SKIP:-false}); API: $API; Site: $SITE"
          [ "$TESTED" = success ] || exit 1
          if [ "$SKIP" = true ]; then [ "$API" = skipped ] && [ "$SITE" = skipped ] && exit 0; exit 1; fi
          [ "$API" = success ] && [ "$SITE" = success ]
      - uses: actions/checkout@v4
        if: needs.tested.outputs.skip != 'true'
      - name: Tested tree
        if: needs.tested.outputs.skip != 'true'
        run: echo "::notice title=Tested tree::$(git rev-parse 'HEAD^{tree}')"

  physics:
    name: Sandbox 2's physics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Whether it runs
        id: touched
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # every push to main runs them; a pull request only when it changes Sandbox 2's code (its files against the
          # merge base, as GitHub lists them)
          if [ "$EVENT" = push ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "a push to main: the physics run"; exit 0; fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if echo "$files" | grep -q '^play/site/src/lib/sandbox-2/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "play/site/src/lib/sandbox-2/ changed: the physics run"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "nothing of Sandbox 2's changed: the physics don't run"
          fi
      - uses: actions/checkout@v4
        if: steps.touched.outputs.run == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.touched.outputs.run == 'true'
        with:
          bun-version-file: .bun-version
      - name: The physics
        if: steps.touched.outputs.run == 'true'
        working-directory: play/site
        run: |
          bun install --frozen-lockfile
          bun run test:physics
