# play's checks, called by main.yml: the API's tests against a real Postgres (play/api/test), its types, and the site's
# build (play/site), which also holds the copied modules to resolving, and its tests (intent 417af727).
#
# Each on a runner of its own, in parallel (they starved each other's 5 s timeouts on one): the job "API" (Postgres,
# the API's types and its whole suite, alone) and the job "Site" (its build, then its fast suite: vitest without Sandbox
# 2's physics, then its *.bun.test.ts with Bun). Sandbox 2's physics are switched off (intent 94c11a28; Samuel
# 2026-11-09): no workflow runs them; they run by hand only (play/avenbox/gate.sh physics). The required
# check keeps its name: the job "API and site" needs "API", "Site" and each world's "Budget" and is green only when all are.
#
# On a pull request and on a merge group of main's merge queue they always run in full. On a push to main (intents
# 5ab64b8e, f7721142) they pass without running again only when the pushed commit is the merge group's commit they
# passed on (./tested-tree.sh asks GitHub's API); anything else, or any doubt, runs them in full. Postgres is started
# only when they run.
name: play checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tested:
    name: The tested tree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.tested.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: The tested tree
        id: tested
        if: github.event_name == 'push'
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PART: play
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/tested-tree.sh

  api:
    name: API
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Postgres
        # avenBOX's version, password, port and room for the tests in parallel (play/avenbox/box.env)
        run: |
          . play/avenbox/box.env
          docker run -d --name postgres -e POSTGRES_PASSWORD="$PG_PASSWORD" -p "$PG_PORT:5432" "postgres:$PG_VERSION-alpine" -c "max_connections=$PG_MAX_CONNECTIONS"
          echo "TEST_DATABASE_URL=$BOX_DATABASE_URL" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: The API
        working-directory: play/api
        run: |
          bun install --frozen-lockfile
          # over TCP: the image's first start (initdb) answers only on its socket until it is ready
          for i in $(seq 1 60); do docker exec postgres pg_isready -h 127.0.0.1 -U postgres > /dev/null && break; sleep 1; done
          docker exec postgres pg_isready -h 127.0.0.1 -U postgres
          # avenBOX's gate, the part whole: its types, then every test file in parallel, red if one is skipped
          bash ../avenbox/gate.sh api --no-up

  site:
    name: Site
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: The site
        working-directory: play/site
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: The site's tests
        working-directory: play/site
        # the fast suite: vitest without Sandbox 2's physics, then the *.bun.test.ts with Bun
        run: bun run test

  budget:
    # each world held to its budget (play/SPEC.md §4.16, intent 1f6a98dd): its census and frame count from the pinned
    # inputs, no token, against play/site/scripts/census/budgets.json; measured only when the change can move a count
    # (a world's code, the census, the budget, the frozen engines, the site's packages), else passed at once
    name: Budget (${{ matrix.world }})
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        world: [sandbox-1, sandbox-5, sandbox-3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Whether the change can move a world's count
        id: moved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          # GitHub's compare: no history fetched; a push to main, or a list cut at 300 files, measures
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then echo "measure=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.files[].filename') || { echo "measure=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ] || printf '%s\n' "$files" | grep -Eq '^(play/site/src/lib/content/|play/site/scripts/census|play/site/scripts/budget\.ts$|play/site/static/engines/|play/site/package\.json$|play/site/bun\.lock$|\.github/workflows/play-checks\.yml$)'; then
            echo "measure=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing of a world changed: its budget holds as on main"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.moved.outputs.measure
        with:
          bun-version-file: .bun-version
      # what main's census builds, kept by the hash of its code and its question (intents-pr.yml saves it): read only
      - uses: actions/cache/restore@v4
        if: steps.moved.outputs.measure
        with:
          path: ${{ runner.temp }}/census-cache/kept
          key: census-kept-${{ github.run_id }}
          restore-keys: census-kept-
      - name: The world against its budget
        if: steps.moved.outputs.measure
        env:
          CENSUS_CACHE: ${{ runner.temp }}/census-cache
          WORLD: ${{ matrix.world }}
        run: |
          (cd play/site && bun install --frozen-lockfile > /dev/null)
          extra=""
          [ "$WORLD" != sandbox-3 ] || extra="--aim tris,draws,calls"
          # shellcheck disable=SC2086
          bun play/site/scripts/budget.ts --world "$WORLD" $extra

  checks:
    name: API and site
    needs: [tested, api, site, budget]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The API's and the site's jobs
        env:
          TESTED: ${{ needs.tested.result }}
          SKIP: ${{ needs.tested.outputs.skip }}
          API: ${{ needs.api.result }}
          SITE: ${{ needs.site.result }}
          BUDGET: ${{ needs.budget.result }}
        run: |
          echo "the tested tree: $TESTED (skip: ${SKIP:-false}); API: $API; Site: $SITE; Budget: $BUDGET"
          [ "$TESTED" = success ] || exit 1
          if [ "$SKIP" = true ]; then [ "$API" = skipped ] && [ "$SITE" = skipped ] && [ "$BUDGET" = skipped ] && exit 0; exit 1; fi
          [ "$API" = success ] && [ "$SITE" = success ] && [ "$BUDGET" = success ]

