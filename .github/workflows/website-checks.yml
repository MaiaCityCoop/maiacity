# the website's checks (website/), called by main.yml: its types and its prerendered build, by avenBOX's gate
# (play/avenbox/gate.sh website). On a pull request they always run, and end by noting the tree they tested; on a push
# to main they pass without running again only when the pushed tree is that very tree (./tested-tree.sh; intent
# 5ab64b8e), else they run in full.
name: website checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - name: The tested tree
        id: tested
        if: github.event_name == 'push'
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PART: website
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/tested-tree.sh
      - uses: oven-sh/setup-bun@v2
        if: steps.tested.outputs.skip != 'true'
        with:
          bun-version-file: .bun-version
      - if: steps.tested.outputs.skip != 'true'
        run: bun install --frozen-lockfile
      - if: steps.tested.outputs.skip != 'true'
        run: bash ../play/avenbox/gate.sh website --no-up
      - name: Tested tree
        if: steps.tested.outputs.skip != 'true'
        run: echo "::notice title=Tested tree::$(git rev-parse 'HEAD^{tree}')"
