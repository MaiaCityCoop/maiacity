# A probe (intent ba948167), on this branch only and gone before it is ready: does a GitHub-hosted macOS runner give
# headless Chromium a working WebGPU on Metal, and Playwright's WebKit too? No secret, no token, no network to play:
# the site's build served with the census's pinned inputs (play/site/scripts/gpu.ts).
name: gpu probe

on:
  pull_request:
    branches: [main]
    
permissions: {}

concurrency:
  group: gpu-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.os }} ${{ matrix.browser }}
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, browser: chromium }
          - { os: macos-26, browser: webkit }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: The machine
        run: |
          sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          system_profiler SPDisplaysDataType || true
      - name: The site's dependencies, its browsers and its build
        working-directory: play/site
        run: |
          time bun install --frozen-lockfile
          time bunx playwright install chromium webkit
          time bun run build
      - name: Sandbox 5 on this machine's GPU
        run: time bun play/site/scripts/gpu.ts --world /sandbox-5/ --browser ${{ matrix.browser }} --timeout 900 --steps --out "$RUNNER_TEMP/gpu" || echo "::warning::the world was not shown in every browser"
      - name: The report
        if: always()
        run: cat "$RUNNER_TEMP/gpu/gpu.json" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-${{ matrix.os }}-${{ matrix.browser }}
          path: ${{ runner.temp }}/gpu
          retention-days: 7
