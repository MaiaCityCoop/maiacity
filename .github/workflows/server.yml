# server: the production machine's care, by hand only — Actions → server → Run workflow (deploy/server-care.sh).
#   report  what fills its disks, what Docker holds, and which of play's files are broken
#   clean   frees what nothing uses (unused images, build cache, the journal, leftovers of backups) and mends play's
#           broken files from the backups in the bucket; then reports again
#   remove-dns  removes every record of one name of the maia.city zone (`record`, e.g. a host no longer served): read
#           first, only what is there removed (deploy/dns.sh, as production.yml's DNS step). It refuses play, api (the
#           deploy's host), www and the apex.
name: server

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report (changes nothing), clean, or remove-dns"
        required: true
        type: choice
        options: [report, clean, remove-dns]
        default: report
      record:
        description: "For remove-dns: the name in maia.city whose records go (e.g. old for old.maia.city)"
        required: false
        default: ""

permissions:
  contents: read

# never beside a deploy or a restore
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  care:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: remove-dns
        if: inputs.mode == 'remove-dns'
        env:
          DNS_TOKEN: ${{ secrets.HETZNER_DNS_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HETZNER_API_KEY }}
          ZONE: maia.city
          NAME: ${{ inputs.record }}
        run: |
          NAME=$(tr 'A-Z' 'a-z' <<< "$NAME"); NAME=${NAME%.maia.city}; NAME=${NAME%.}
          [[ "$NAME" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$ ]] || { echo "::error::remove-dns: '$NAME' is not a name in $ZONE"; exit 1; }
          case "$NAME" in
            play|api|www|@|maia.city) echo "::error::remove-dns: $NAME.$ZONE is served (play, api, www and the apex are never removed here)"; exit 1 ;;
          esac
          bash deploy/dns.sh remove "$NAME"
      - uses: ./.github/actions/prod-ssh
        if: inputs.mode != 'remove-dns'
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Copy the script and the bucket's access
        if: inputs.mode != 'remove-dns'
        env:
          S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
        run: |
          ssh prod "mkdir -p $APP_DIR/deploy $APP_DIR/backups-tmp"
          scp deploy/lib.sh deploy/server-care.sh "prod:$APP_DIR/deploy/"
          bash deploy/bucket-keys.sh --if-set
      - name: ${{ inputs.mode }}
        if: inputs.mode != 'remove-dns'
        env:
          MODE: ${{ inputs.mode }}
        run: ssh prod "cd $APP_DIR && timeout 2400 bash deploy/server-care.sh '$MODE'"
